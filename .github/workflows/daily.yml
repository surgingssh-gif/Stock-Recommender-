# Runs the bot every weekday morning on GitHub's computers,
# so it works even when your own computer is off.
name: Daily stock ideas

on:
  schedule:
    # 12:30 UTC, Monday-Friday = 8:30 AM New York time in summer (EDT),
    # 7:30 AM in winter (EST). GitHub sometimes starts scheduled runs
    # a few minutes late - that's normal.
    - cron: "30 12 * * 1-5"
  # Adds a "Run workflow" button on the Actions tab so you can test it anytime.
  workflow_dispatch:

# Lets the workflow save picks_log.csv back into the repository.
permissions:
  contents: write

# If two runs overlap (e.g. a manual run during the scheduled one), let the
# first finish so they don't both try to save at the same time.
concurrency:
  group: daily-stock-ideas
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
        run: python main.py

      # Rebuild the dashboard web page's data (latest prices + scorecard).
      # "always()" means these steps still run if the Discord step failed.
      - name: Build dashboard
        if: always()
        run: python build_dashboard.py

      # Save the picks log, daily details and dashboard so they build up over time.
      - name: Save picks and dashboard
        if: always()
        run: |
          git config user.name "stock-news-bot"
          git config user.email "stock-news-bot@users.noreply.github.com"
          git add picks_log.csv data docs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Log picks and update dashboard for $(date -u +%Y-%m-%d)"
            git push
          fi
